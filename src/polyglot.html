<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Polyglot Coach</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  /* 60 neutral */ --bg:#F5F6FB; --surface:#FFFFFF; --surface-2:#EEF0F7;
  /* 30 structure */ --text:#1B1D2A; --text-2:#585D72; --border:#E1E4EE;
  /* 10 accent */ --accent:#4C3FC8; --accent-2:#6A5AE0; --accent-hover:#3F33AE; --accent-deep:#2F2690; --accent-soft:#ECEAFF; --on-accent:#FFFFFF;
  --on-accent-2:rgba(255,255,255,.88); --glass:rgba(255,255,255,.18); --glass-2:rgba(255,255,255,.28);
  /* states */ --ok:#1E8E3E; --ok-deep:#16702F; --err:#C92A2A; --err-deep:#9E1F1F; --ok-soft:#E3F6E8; --err-soft:#FDECEC; --flame:#E8590C;
  /* categorical language tags */ --en:#3B5BDB; --fr:#C2255C; --nl:#D9480F;
  /* 8px grid */ --s05:4px; --s1:8px; --s2:16px; --s3:24px; --s4:32px; --s5:40px; --s6:48px; --s7:56px; --s8:64px;
  /* radii */ --r-md:8px; --r-lg:16px; --r-xl:24px; --r-pill:999px;
  /* type scale: Major Third 1.25 */ --fs-cap:12.8px; --fs-body:16px; --fs-h3:20px; --fs-h2:25px; --fs-h1:31.25px; --fs-word:39px;
  --focus:0 0 0 3px var(--accent-deep); --shadow:0 8px 24px rgba(27,29,42,.06); --press:0 4px 0;
  --t:160ms ease; --nav-h:72px; --max:560px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Nunito,system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:var(--fs-body);line-height:1.5;padding-bottom:calc(var(--nav-h) + var(--s3));-webkit-tap-highlight-color:transparent}
h1{font-size:var(--fs-h1);font-weight:700}h2{font-size:var(--fs-h2);font-weight:700;line-height:1.25}h3{font-size:var(--fs-h3);font-weight:700}
.wrap{max-width:var(--max);margin:0 auto;padding:0 var(--s2) var(--s2)}
header{display:flex;align-items:center;justify-content:space-between;gap:var(--s2);padding:var(--s3) var(--s2) var(--s2);max-width:var(--max);margin:0 auto}
header h1{font-size:var(--fs-h2);letter-spacing:-.02em}
header h1 span{color:var(--accent)}
.row{display:flex;align-items:center;gap:var(--s1);flex-wrap:wrap}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:var(--s2)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-xl);padding:var(--s3);box-shadow:var(--shadow)}
.muted{color:var(--text-2)}.cap{font-size:var(--fs-cap)}
button,.btn,select,input,textarea{font:inherit}
button,.btn{font-weight:500;cursor:pointer;border:2px solid var(--border);background:var(--surface);color:var(--text);border-radius:var(--r-lg);padding:var(--s1) var(--s2);min-height:var(--s6);transition:background var(--t),transform var(--t),box-shadow var(--t);display:inline-flex;align-items:center;justify-content:center;gap:var(--s1);text-decoration:none;box-shadow:var(--press) var(--border)}
button:hover,.btn:hover{background:var(--surface-2);transform:translateY(-1px)}
button:active,.btn:active{transform:translateY(4px);box-shadow:0 0 0 var(--border)}
button:focus-visible,.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible,summary:focus-visible{outline:none;box-shadow:var(--focus)}
button:disabled{opacity:.45;pointer-events:none}
.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent);box-shadow:var(--press) var(--accent-deep);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.primary:hover{background:var(--accent-hover)}
.primary:active{box-shadow:0 0 0 var(--accent-deep)}
.icon{width:var(--s6);height:var(--s6);padding:0;border-radius:var(--r-pill)}
.icon.big{width:var(--s7);height:var(--s7);background:var(--accent-soft);border:none;color:var(--accent);box-shadow:none}
.ghost{border-color:transparent;background:transparent;color:var(--accent);box-shadow:none}
.ghost:hover{background:var(--accent-soft)}
svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.chip{border-radius:var(--r-pill);min-height:var(--s5);padding:0 var(--s2);font-size:var(--fs-cap);font-weight:700;box-shadow:none;border-width:2px}
.chip svg{width:16px;height:16px}
.chip .dot{width:var(--s1);height:var(--s1);border-radius:var(--r-pill)}
.chip[aria-pressed=true]{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.streak{display:inline-flex;align-items:center;gap:var(--s05);font-weight:700;color:var(--flame);background:var(--surface);border:2px solid var(--border);border-radius:var(--r-pill);padding:0 var(--s2);min-height:var(--s5)}
.streak svg{width:20px;height:20px}
.word{font-size:var(--fs-word);font-weight:700;line-height:1.15;word-break:break-word;letter-spacing:-.01em}
.def{font-size:var(--fs-h3);font-weight:500}
.ex{font-style:italic;color:var(--text-2)}
.tag{display:inline-block;font-size:var(--fs-cap);font-weight:700;padding:0 var(--s1);border-radius:var(--r-md);background:var(--surface-2);color:var(--text)}
.lang-bar{height:var(--s05);border-radius:var(--r-pill);width:var(--s6)}
/* hero (word of the day) */
.hero{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:var(--on-accent);border:none;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;width:220px;height:220px;border-radius:var(--r-pill);background:var(--glass);right:-80px;top:-80px;pointer-events:none}
.hero .muted,.hero .ex,.hero i{color:var(--on-accent-2)}
.hero .icon.big{background:var(--glass);color:var(--on-accent);position:relative;z-index:1}
.hero .ghost,.hero a.btn{color:var(--on-accent)}
.hero .ghost:hover,.hero .icon:hover{background:var(--glass-2)}
.hero .icon{background:var(--glass);border:none;box-shadow:none;color:var(--on-accent)}
.hero .tag{background:var(--glass);color:var(--on-accent)}
.hero .trans{background:var(--glass);border-radius:var(--r-lg);padding:var(--s2)}
.hero .trans .muted{color:var(--on-accent)}
.eyebrow{font-size:var(--fs-cap);font-weight:700;text-transform:uppercase;letter-spacing:.08em}
/* daily goal */
.goal{display:flex;align-items:center;gap:var(--s2)}
.ring{width:var(--s8);height:var(--s8);flex:none;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:var(--fs-cap)}
.todo{display:flex;flex-direction:column;gap:var(--s05);font-size:var(--fs-cap);font-weight:500}
.todo span{display:flex;align-items:center;gap:var(--s1)}
.todo svg{width:16px;height:16px}
.todo .on{color:var(--ok)}.todo .off{color:var(--text-2)}
/* nav */
nav{position:fixed;bottom:0;left:0;right:0;height:var(--nav-h);background:var(--surface);border-top:1px solid var(--border);display:flex;justify-content:space-around;align-items:center;padding:0 var(--s1);z-index:5}
nav button{flex:1 1 0;min-width:0;padding:var(--s05) 0!important;flex-direction:column;gap:0;border:none;background:none;font-size:var(--fs-cap);color:var(--text-2);min-height:var(--s7);box-shadow:none;border-radius:var(--r-lg);padding:var(--s05) var(--s2)}
nav button[aria-current=page]{color:var(--accent);background:var(--accent-soft);font-weight:700}
nav button:active{transform:scale(.95)}
.hidden{display:none!important}
.seg{display:flex;gap:var(--s1);overflow-x:auto;scrollbar-width:none;padding-bottom:var(--s05)}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:none;font-size:var(--fs-cap);font-weight:700;border-radius:var(--r-pill);min-height:var(--s5);box-shadow:none}
.seg button[aria-pressed=true]{background:var(--text);color:var(--surface);border-color:var(--text)}
.opt{width:100%;justify-content:flex-start;text-align:left;font-weight:500}
.opt.ok{background:var(--ok-soft);border-color:var(--ok);box-shadow:var(--press) var(--ok)}.opt.bad{background:var(--err-soft);border-color:var(--err);box-shadow:var(--press) var(--err)}
/* learning path */
details.card{padding:var(--s2) var(--s3)}
summary{list-style:none}summary::-webkit-details-marker{display:none}
.pbar{height:var(--s1);background:var(--surface-2);border-radius:var(--r-pill);overflow:hidden;margin-top:var(--s1)}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-2));border-radius:var(--r-pill)}
.path{border:none;box-shadow:none;background:transparent;padding:var(--s1) 0;min-height:var(--s7)}
.path:hover{background:transparent}
.node{width:var(--s6);height:var(--s6);border-radius:var(--r-pill);display:inline-flex;align-items:center;justify-content:center;flex:none;font-weight:700;background:var(--surface-2);color:var(--text-2);border:2px solid var(--border)}
.node svg{width:20px;height:20px}
.path.done .node{background:var(--accent);color:var(--on-accent);border-color:var(--accent);box-shadow:var(--press) var(--accent-deep)}
.path.current .node{background:var(--surface);color:var(--accent);border:3px solid var(--accent);box-shadow:0 0 0 6px var(--accent-soft)}
.path.current{font-weight:700}
.path.exam .node{background:var(--flame);border-color:var(--flame);color:var(--on-accent)}
/* chat */
.bubble{padding:var(--s2);border-radius:var(--r-xl);max-width:88%}
.me{background:var(--accent);color:var(--on-accent);align-self:flex-end;border-bottom-right-radius:var(--r-md)}
.bot{background:var(--surface);border:1px solid var(--border);align-self:flex-start;border-bottom-left-radius:var(--r-md);box-shadow:var(--shadow)}
.fix{border-left:4px solid var(--err);background:var(--err-soft);padding:var(--s1) var(--s2);border-radius:var(--r-md);margin-top:var(--s1);font-size:var(--fs-cap);color:var(--text)}
.native{border-left:4px solid var(--ok);background:var(--ok-soft);padding:var(--s1) var(--s2);border-radius:var(--r-md);margin-top:var(--s1);font-size:var(--fs-cap);color:var(--text)}
input,select,textarea{border:2px solid var(--border);border-radius:var(--r-lg);padding:var(--s1) var(--s2);background:var(--surface);color:var(--text);min-height:var(--s6);width:100%}
.stat{flex:1;min-width:120px;text-align:center;padding:var(--s2)}
.stat b{display:block;font-size:var(--fs-h1);color:var(--accent)}
.overlay{position:fixed;inset:0;background:rgba(27,29,42,.72);display:flex;align-items:center;justify-content:center;padding:var(--s2);z-index:10}
.overlay .card{width:100%;max-width:var(--max);max-height:100%;overflow:auto}
.lesson p,.lesson li{margin-bottom:var(--s1)}.lesson ul{padding-left:var(--s3)}
.lesson table{border-collapse:collapse;width:100%}.lesson td,.lesson th{border:1px solid var(--border);padding:var(--s05) var(--s1);text-align:left}.lesson th{background:var(--surface-2)}
.bars{display:flex;align-items:flex-end;gap:var(--s1);height:var(--s8)}
.bars div{flex:1;background:linear-gradient(180deg,var(--accent-2),var(--accent));border-radius:var(--r-md) var(--r-md) 0 0;min-height:2px}
.bars-l{display:flex;gap:var(--s1)}.bars-l span{flex:1;text-align:center;font-size:var(--fs-cap);color:var(--text-2)}
.k,.kall{border-radius:var(--r-md);padding:0 2px;transition:background var(--t),color var(--t);cursor:pointer}
.k.on,.kall.on{background:var(--accent);color:var(--on-accent)}
.hero .k.on,.hero .kall.on{background:var(--on-accent);color:var(--accent)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + var(--s2));background:var(--accent);color:var(--on-accent);font-weight:700;padding:var(--s1) var(--s3);border-radius:var(--r-pill);box-shadow:var(--shadow);z-index:9;display:flex;align-items:center;gap:var(--s1);max-width:calc(100% - var(--s4))}
.toast.top{bottom:auto;top:var(--s2);background:var(--text);width:calc(100% - var(--s4));max-width:var(--max);display:block;text-align:center;border-radius:var(--r-lg)}
.toast.top svg{vertical-align:middle}
.turnbox{white-space:nowrap}
.toast svg{color:var(--flame)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:var(--s2)}
.badge{display:flex;flex-direction:column;align-items:center;gap:var(--s1);text-align:center;font-size:var(--fs-cap);color:var(--text-2)}
.badge.on{color:var(--text);font-weight:700}
.badge.on .node{background:linear-gradient(135deg,var(--flame),var(--accent-2));color:var(--on-accent);border:none;box-shadow:var(--press) var(--accent-deep)}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:var(--s1);text-align:center}
.cal{min-height:var(--s5);padding:0;border:none;box-shadow:none;border-radius:var(--r-pill);background:transparent}
.cal.done{background:var(--accent-soft);color:var(--accent);font-weight:700}
.cal.today{background:var(--accent);color:var(--on-accent)}
.big-q{font-size:var(--fs-h2);font-weight:700;text-align:center;padding:var(--s3) 0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <h1>Polyglot<span>.</span></h1>
  <div class="row">
    <span class="streak" id="streak" aria-label="Streak"></span>
    <button class="chip" id="uiLang" aria-label="UI language">FR</button>
    <button class="icon" id="btnSettings" aria-label="Settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
  </div>
</header>

<main class="wrap">
  <!-- TODAY -->
  <section id="v-today" class="stack">
    <article class="card goal" id="goal"></article>
    <div class="row between">
      <button class="icon" id="prevDay" aria-label="Previous day"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
      <span id="dayLabel" class="muted"></span>
      <button class="icon" id="nextDay" aria-label="Next day"><svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></button>
    </div>
    <div class="row" id="todayLangs"></div>
    <article class="card stack hero" id="wordCard"></article>
    <article class="card stack" id="exprCard"></article>
  </section>

  <!-- LEARN -->
  <section id="v-learn" class="stack hidden">
    <div class="seg" id="learnSeg"></div>
    <div class="row" id="learnLangs"></div>
    <div id="learnBody" class="stack"></div>
  </section>

  <!-- SPEAK -->
  <section id="v-speak" class="stack hidden">
    <div class="row" id="speakLangs"></div>
    <select id="scenario"></select>
    <div id="chat" class="stack"></div>
    <div class="row" style="flex-wrap:nowrap">
      <button class="icon" id="mic" aria-label="Dictate"><svg viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 17v5"/></svg></button>
      <input id="msg" autocomplete="off">
      <button class="primary icon" id="send" aria-label="Send"><svg viewBox="0 0 24 24"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg></button>
    </div>
    <p class="cap muted" id="speakInfo"></p>
  </section>

  <!-- PROGRESS -->
  <!-- DICTIONARY + CALENDAR -->
  <section id="v-dico" class="stack hidden">
    <div class="seg" id="dicoSeg"></div>
    <div id="dicoBody" class="stack"></div>
  </section>
  <section id="v-progress" class="stack hidden"></section>
</main>

<nav id="nav"></nav>
<div id="turn" class="toast turnbox hidden" role="status"></div>
<div id="toast" class="toast top hidden" role="status"></div>

<div class="overlay hidden" id="settings"><div class="card stack" id="settingsBody"></div></div>
<div class="overlay hidden" id="popup"><div class="card stack" id="popupBody"></div></div>

<script>
/* ---------- ICONS (outline family only) ---------- */
const I={
 sound:'<svg viewBox="0 0 24 24"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></svg>',
 dice:'<svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8" cy="8" r=".5"/><circle cx="16" cy="8" r=".5"/><circle cx="12" cy="12" r=".5"/><circle cx="8" cy="16" r=".5"/><circle cx="16" cy="16" r=".5"/></svg>',
 heart:'<svg viewBox="0 0 24 24"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"/></svg>',
 heartOn:'<svg viewBox="0 0 24 24" style="fill:currentColor"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"/></svg>',
 copy:'<svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>',
 search:'<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>',
 today:'<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>',
 learn:'<svg viewBox="0 0 24 24"><path d="M2 4h6a4 4 0 0 1 4 4v13a3 3 0 0 0-3-3H2zM22 4h-6a4 4 0 0 0-4 4v13a3 3 0 0 1 3-3h7z"/></svg>',
 speak:'<svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>',
 flame:'<svg viewBox="0 0 24 24"><path d="M12 2c1 4 5 6 5 11a5 5 0 0 1-10 0c0-2 1-4 2-5 0 2 1 3 2 3 0-3-1-6 1-9z"/></svg>',
 check:'<svg viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg>',
 circle:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/></svg>',
 star:'<svg viewBox="0 0 24 24"><path d="M12 2l3.1 6.3 6.9 1-5 4.9 1.2 6.8L12 17.8 5.8 21l1.2-6.8-5-4.9 6.9-1z"/></svg>',
 dico:'<svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5z"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"/><path d="M9 7h7M9 11h5"/></svg>',
 prog:'<svg viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="M7 14l4-4 4 4 5-6"/></svg>'
};

 fr:[
  {id:"fr1",title:"Articles: le, la, l', les / un, une, des",body:"<p>Every French noun is <b>masculine</b> or <b>feminine</b>. The article shows it.</p><ul><li><b>Definite</b> (the): <b>le</b> (m), <b>la</b> (f), <b>l'</b> before a vowel/h, <b>les</b> (plural).</li><li><b>Indefinite</b> (a/some): <b>un</b> (m), <b>une</b> (f), <b>des</b> (plural).</li></ul><p>Always learn a noun <b>with its article</b>: <i>la table</i>, <i>le livre</i>.</p>",ex:["le livre","la maison","l'école","un ami","une amie","des enfants"],q:[["___ soleil (m)",["le","la","l'"],0],["___ voiture (f)",["un","une","des"],1],["___ arbre",["le","la","l'"],2],["___ enfants",["les","la","un"],0]]},
  {id:"fr2",title:"Gender: endings that help",body:"<p>Some endings tell you the gender most of the time:</p><ul><li><b>Masculine</b>: -age (le fromage), -ment (le moment), -eau (le bureau), -isme, -phone.</li><li><b>Feminine</b>: -tion (la nation), -té (la liberté), -ure (la peinture), -ette, -ance/-ence.</li></ul><p>Exceptions exist: <i>la plage, l'image (f), le musée</i>.</p>",ex:["le garage","le gâteau","la question","la beauté","la culture"],q:[["___ communication",["le","la"],1],["___ chapeau",["le","la"],0],["___ voyage",["le","la"],0],["___ liberté",["le","la"],1]]},
  {id:"fr3",title:"Présent: être & avoir",body:"<p><b>être</b> (to be): je suis, tu es, il/elle est, nous sommes, vous êtes, ils/elles sont.</p><p><b>avoir</b> (to have): j'ai, tu as, il/elle a, nous avons, vous avez, ils/elles ont.</p><p>Careful: age uses <b>avoir</b>: <i>J'ai 30 ans</i> (not « je suis 30 »).</p>",ex:["Je suis belge.","Nous avons une voiture.","Elle a 25 ans."],q:[["Nous ___ fatigués.",["sommes","avons","êtes"],0],["Ils ___ deux enfants.",["sont","ont","as"],1],["J'___ 30 ans.",["suis","ai","es"],1],["Vous ___ prêts ?",["êtes","avez","sont"],0]]}

  {id:"nl1",title:"Lidwoorden: de, het, een",body:"<p>Dutch has two words for 'the': <b>de</b> and <b>het</b>. 'A' is always <b>een</b>.</p><ul><li><b>de</b>: most nouns, people (de man, de vrouw), and <b>all plurals</b> (de huizen).</li><li><b>het</b>: diminutives -je (het meisje), languages (het Frans), and many words starting with be-, ge-, ver-, ont- (het gesprek).</li></ul><p>Learn each noun with its article.</p>",ex:["de stoel","het huis","een boek","de boeken","het meisje"],q:[["___ meisje",["de","het"],1],["___ huizen (plural)",["de","het"],0],["___ man",["de","het"],0],["___ gesprek",["de","het"],1]]},
  {id:"nl2",title:"Word order: verb in 2nd place",body:"<p>In a main sentence, the conjugated verb is <b>always in 2nd position</b>.</p><ul><li>Ik <b>werk</b> vandaag.</li><li>Vandaag <b>werk</b> ik. (time first → subject moves after the verb)</li></ul><p>In a question without question word, the verb goes first: <i><b>Werk</b> jij vandaag?</i></p>",ex:["Ik woon in Gent.","Morgen ga ik naar Antwerpen.","Spreek jij Nederlands?"],q:[["Vandaag ___ .",["ik werk","werk ik"],1],["Morgen ___ naar school.",["ga ik","ik ga"],0],["___ Nederlands?",["Spreek jij","Jij spreekt"],0]]},
  {id:"nl3",title:"zijn & hebben",body:"<p><b>zijn</b> (to be): ik ben, jij bent (bent jij → <b>ben jij</b>), hij/zij is, wij zijn, jullie zijn, zij zijn.</p><p><b>hebben</b> (to have): ik heb, jij hebt (<b>heb jij</b>), hij heeft, wij hebben, jullie hebben, zij hebben.</p><p>When jij/je comes after the verb, drop the -t.</p>",ex:["Ik ben moe.","Heb jij tijd?","Zij heeft een fiets."],q:[["Hij ___ een auto.",["heeft","hebt","heb"],0],["___ jij moe?",["Bent","Ben","Is"],1],["Wij ___ Belgen.",["zijn","is","bent"],0]]}

  {id:"en2",title:"Present simple vs continuous",body:"<p><b>Present simple</b>: habits and facts — <i>I work in Brussels.</i> (he/she/it + <b>-s</b>)</p><p><b>Present continuous</b> (be + -ing): now / temporary — <i>I'm working right now.</i></p>",ex:["She speaks French.","They're eating now."],q:[["She ___ French every day.",["speaks","is speaking"],0],["Look! It ___ .",["rains","is raining"],1],["He ___ in Ghent.",["live","lives"],1]]},

var kTimers=[];let sayId=0;

/* pick a real voice for the language; without it the phone reads Dutch with a French/English voice */
function voiceFor(lang){try{const v=speechSynthesis.getVoices(),code=PACKS[lang].voice;return v.find(x=>x.lang.replace("_","-")===code)||v.find(x=>x.lang.toLowerCase().startsWith(lang))||null}catch(e){return null}}
function missingVoice(lang){if(tts&&tts.native)return nativeLang[lang]===null;try{return !tts&&speechSynthesis.getVoices().length>0&&!voiceFor(lang)}catch(e){return false}}
/* karaoke: each word in a span carrying its char offset */
function kspans(text){let out="",re=/\S+/g,m,last=0;while((m=re.exec(text))){out+=esc(text.slice(last,m.index))+`<span class="k" data-c="${m.index}">${esc(m[0])}</span>`;last=m.index+m[0].length}return out+esc(text.slice(last))}
function kClear(){document.querySelectorAll(".k.on,.kall.on").forEach(e=>e.classList.remove("on"))}
function kAt(el,ci){if(!el)return;const sp=[...el.querySelectorAll(".k")];kClear();if(!sp.length){el.classList.add("on");return}let cur=sp[0];sp.forEach(x=>{if(+x.dataset.c<=ci)cur=x});cur.classList.add("on")}
function showTurn(on){const e=$("turn");if(e){e.textContent=t("yourTurn");e.classList.toggle("hidden",!on)}}
function toast(html){const e=$("toast");e.innerHTML=html;e.classList.remove("hidden");clearTimeout(toast.h);toast.h=setTimeout(()=>e.classList.add("hidden"),3500)}
const wait=ms=>new Promise(r=>setTimeout(r,ms));
/* text for the voice: no "/", brackets or grammar notes, which voices read aloud ("schuine streep", "slash") or stumble on */
const speakable=t=>String(t).replace(/\((m|f|m\.|f\.|m\.\/f\.|BE|NL-BE|[^)]{0,40})\)/g," ").replace(/\s*\/\s*/g,", ").replace(/[«»"“”…]/g," ").replace(/\s+/g," ").replace(/\s+([,.!?])/g,"$1").trim();
/* speak one line; resolves when finished. Highlight is timed (works on every engine), refined by word boundaries when the engine sends them */
function speakOne(l,lang,id){return new Promise(res=>{
  const el=l.el?$(l.el):null,rate=l.rate||S.rate,off=l.off||0,st={b:false};let done=false;
  const fin=()=>{if(done)return;done=true;kTimers.forEach(clearTimeout);kTimers=[];res()};
  const sp=el?[...el.querySelectorAll(".k")].filter(x=>+x.dataset.c>=off&&+x.dataset.c<off+l.text.length):[];
  kAt(el,off);const ms=85/rate;
  sp.forEach(x=>kTimers.push(setTimeout(()=>{if(!st.b&&id===sayId)kAt(el,+x.dataset.c)},(+x.dataset.c-off)*ms)));
  if(tts){tts.speak(speakable(l.text),{rate:tts.native?rate:Math.max(.7,rate),language:lang}).then(fin).catch(e=>{if(e&&e.code==="not_granted")tts=null;fin()});return}
  try{const u=new SpeechSynthesisUtterance(speakable(l.text));u.lang=PACKS[lang].voice;const v=voiceFor(lang);if(v)u.voice=v;u.rate=rate;
    u.onboundary=e=>{if(e.name&&e.name!=="word")return;st.b=true;if(id===sayId)kAt(el,off+e.charIndex)};
    u.onend=fin;u.onerror=fin;speechSynthesis.speak(u);
    setTimeout(fin,l.text.length*140/rate+3000); /* Android sometimes never fires onend */
  }catch(e){fin()}
})}
/* lines: [{text, rate, el, off, turn}] — turn = pause (ms) for the learner to repeat */
async function sayLines(lines,lang){
  stopAudio();const id=sayId;await wait(150);
  for(const l of lines){
    if(id!==sayId)return;await speakOne(l,lang,id);if(id!==sayId)return;kClear();
    if(l.turn){if(l.el){const e=$(l.el);l.el&&kAt(e,l.off||0)}showTurn(true);await wait(l.turn);showTurn(false);kClear()}else await wait(400);
  }
}
function say(text,lang,rate){sayLines([{text,rate:rate||S.rate}],lang)}
/* teaching sequence: word slowly x2, then the example sentence */
function teach(o,lang){const w=o.w.replace(/^to /,"");sayLines([{text:w,rate:.55,el:"kw"},{text:w,rate:.55,el:"kw"},{text:o.x,rate:S.rate,el:"kx"}],lang)}
/* repeat after me: word, your turn; sentence in chunks of 3 words, your turn after each; then the full sentence */
function repeatMode(o,lang){
  const w=o.w.replace(/^to /,""),x=o.x,lines=[{text:w,rate:.55,el:"kw",turn:2500}];
  const ws=[...x.matchAll(/\S+/g)];
  for(let i=0;i<ws.length;i+=3){const a=ws[i].index,z=ws[Math.min(i+2,ws.length-1)];const txt=x.slice(a,z.index+z[0].length);lines.push({text:txt,rate:.6,el:"kx",off:a,turn:txt.length*120+1500})}
  lines.push({text:x,rate:S.rate,el:"kx",turn:x.length*90+2000});
  sayLines(lines,lang);
}

/* 10. Weekly report — computed locally */
function weekly(){
  const days=[...Array(7)].map((_,i)=>{const d=new Date();d.setDate(d.getDate()-6+i);return dayKey(d)});
  const sum=k=>days.reduce((s,d)=>s+((S.log[d]||{})[k]||0),0);
  const tot=d=>Object.values(S.log[d]||{}).reduce((a,b)=>a+b,0),max=Math.max(1,...days.map(tot));
  const rules={};S.errors.filter(e=>days.includes(e.d)).forEach(e=>rules[e.rule]=(rules[e.rule]||0)+1);
  const top=Object.entries(rules).sort((a,b)=>b[1]-a[1]).slice(0,3);
  const loc=S.ui==="fr"?"fr-BE":"en-GB";
  const line=(k,v)=>`<div class="row between"><span>${t(k)}</span><b>${v}</b></div>`;
  return `<article class="card stack"><h3>${t("weekly")}</h3>
   <div><div class="bars">${days.map(d=>`<div style="height:${Math.round(tot(d)/max*100)}%" title="${tot(d)}"></div>`).join("")}</div>
   <div class="bars-l">${days.map(d=>`<span>${new Date(d+"T12:00").toLocaleDateString(loc,{weekday:"narrow"})}</span>`).join("")}</div></div>
   ${line("wActive",days.filter(d=>tot(d)>0).length+"/7")}${line("wWords",sum("w"))}${line("wLessons",sum("l"))}${line("wVocab",sum("v"))}${line("wErr",sum("e"))}${line("wMast",sum("m"))}${line("wAI",sum("a"))}
   <div><b>${t("wTop")}</b>${top.length?top.map(([r,n])=>`<div class="cap">${esc(r)} <span class="muted">×${n}</span></div>`).join(""):`<div class="cap muted">${t("none")}</div>`}</div>
   <div class="native"><b>${t("wGoal")} :</b> ${t("wGoalTxt").replace("%",Math.max(3,sum("l")+1))}</div></article>`;
}

/* ---------- ANTHROPIC API (APK / browser) — same shape as the artifact "sample" capability ---------- */
function apiSample(){
  if(!S.apiKey)return null;
  const call=async p=>{
    const r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"content-type":"application/json","x-api-key":S.apiKey,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
      body:JSON.stringify({model:"claude-haiku-5-5",max_tokens:8000,messages:typeof p==="string"?[{role:"user",content:p}]:p})});
    const j=await r.json().catch(()=>({}));
    if(!r.ok)throw{code:r.status===429?"rate_limited":"api_error",message:(j.error&&j.error.message)||("HTTP "+r.status)};
    return{text:(j.content||[]).map(c=>c.text||"").join("")};
  };
  const f=p=>call(p);
  f.json=async p=>{const{text}=await call(p);return JSON.parse(text.replace(/```json|```/g,"").trim())};
  return f;
}

    P.App.addListener("appStateChange",st=>{if(st.isActive){if(Object.values(nativeLang).includes(null)){try{P.Voice&&P.Voice.refresh()}catch(e){}Object.keys(nativeLang).forEach(k=>{if(nativeLang[k]===null)delete nativeLang[k]})}scheduleNotifs();checkPopup();if(view==="today")renderToday()}});
    P.App.addListener("backButton",()=>{
      if(!$("popup").classList.contains("hidden"))return; /* the word of the day cannot be skipped */
      if(!$("settings").classList.contains("hidden")){$("settings").classList.add("hidden");return}
      if(view!=="today")go("today");else P.App.minimizeApp();
    });
  }
  scheduleNotifs();
}
/* find a voice the phone really has: nl-BE, then nl-NL, then nl (Samsung's own engine often has no Dutch) */
const nativeLang={};
async function resolveNativeLang(lang){
  if(nativeLang[lang]!==undefined)return nativeLang[lang];
  const P=Capacitor.Plugins.Voice||Capacitor.Plugins.TextToSpeech,alt={nl:"nl-NL",fr:"fr-FR",en:"en-US"}[lang];
  for(const l of [PACKS[lang].voice,alt,lang].filter(Boolean)){try{const r=await P.isLanguageSupported({lang:l});if(r&&r.supported){nativeLang[lang]=l;return l}}catch(e){}}
  nativeLang[lang]=null;if(view==="today")renderToday();return null;
}
/* daily notifications at the popup times; tapping opens the app, where the mandatory popup appears */
async function scheduleNotifs(){
  const N=window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.LocalNotifications;if(!N)return;
  try{
    await N.requestPermissions();
    await N.createChannel({id:"daily",name:t("wotd"),importance:5,visibility:1,vibration:true});
    const pend=await N.getPending();
    if(pend.notifications.length)await N.cancel({notifications:pend.notifications.map(n=>({id:n.id}))});
    const list=[],now=new Date();
    for(let i=0;i<14;i++)[[1,S.time,"notifB"],[2,S.time2,"notifB2"]].forEach(([n,tm,k])=>{if(!tm)return;const[h,m]=tm.split(":").map(Number);
      const at=new Date(now.getFullYear(),now.getMonth(),now.getDate()+i,h,m);
      if(at<=now||(i===0&&S.doneDay===todayKey()))return;
      list.push({id:i*2+n,title:"Polyglot",body:t(k),channelId:"daily",schedule:{at,allowWhileIdle:true}})});
    if(list.length)await N.schedule({notifications:list});
  }catch(e){console.log("notifications",e)}
}

/* ---------- NAV ---------- */
const VIEWS=[["today",I.today],["dico",I.dico],["learn",I.learn],["speak",I.speak],["progress",I.prog]];
function go(v){
  stopAudio();view=v;checkBadges();
  $("uiLang").textContent=S.ui.toUpperCase();
  $("streak").innerHTML=I.flame+curStreak();
  $("nav").innerHTML=VIEWS.map(([k,ic])=>`<button data-v="${k}" ${k===v?'aria-current="page"':""}>${ic}${t(k)}</button>`).join("");
  $("nav").querySelectorAll("button").forEach(b=>b.onclick=()=>go(b.dataset.v));
  VIEWS.forEach(([k])=>$("v-"+k).classList.toggle("hidden",k!==v));
  ({today:renderToday,dico:renderDico,learn:renderLearn,speak:renderSpeak,progress:renderProgress})[v]();
}

/* ---------- BOOT ---------- */
document.documentElement.lang=S.ui;
loadDict().then(()=>{go(view);checkPopup()});
go("today");
try{speechSynthesis.onvoiceschanged=()=>{if(view==="today")renderToday()}}catch(e){}let shownDay=todayKey();
setInterval(()=>{if(todayKey()!==shownDay){shownDay=todayKey();offset=0;randomPick=null;$("popup").classList.add("hidden");scheduleNotifs();go(view)}checkPopup()},30000);
/* ---------- ENVIRONMENT: claude.ai artifact, Android app (Capacitor) or plain browser ---------- */
const NATIVE=!!(window.Capacitor&&Capacitor.isNativePlatform&&Capacitor.isNativePlatform());
if(window.claude&&claude.use){
  claude.use("tts").then(x=>{tts=x}).catch(()=>{});
  claude.use("dictation").then(x=>{dict=x;bindDict(()=>micTarget);if(view==="speak")renderSpeak()}).catch(()=>{});
  claude.use("sample").then(x=>{sample=x;if(view==="speak")drawChat();ensureWords()}).catch(()=>{});
}else{
  /* outside claude.ai: AI only with the user's own Anthropic API key (Settings) */
  sample=apiSample();
  if(NATIVE)nativeInit();
  setTimeout(ensureWords,300);
}
