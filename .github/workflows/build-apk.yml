name: Build APK
# Every push to main builds the Android app and publishes it as a GitHub Release
# (open the release on your phone and tap Polyglot.apk to install / update).
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Build web bundle and sync Android
        run: |
          npm ci
          node scripts/build-web.js
          npx cap sync android
      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Rename
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Polyglot.apk
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: Polyglot-apk
          path: Polyglot.apk
      - name: Publish as release (easy download on the phone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Polyglot build ${{ github.run_number }}
          body: Download Polyglot.apk below and open it on your Android phone.
          files: Polyglot.apk
